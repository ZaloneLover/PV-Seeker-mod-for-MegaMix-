; PV Seek settings. Everything here is optional.
; Game addresses are fixed in src/PvSeek.cpp and are not read from this file.
[PvSeek]

; ---- behaviour ----

; Allow exactly this mode value. The game reported 3 when PV Viewer was tested.
; Practice, normal play, other values and unreadable mode memory are blocked.
ViewerMode=3

; Step sizes for the [ and ] keys (Shift = big step), in seconds.
StepSmallSeconds=5
StepBigSeconds=30

; Seeking with restart is the safe way: the game rebuilds the PV (motions, camera, 2D) and
; the music follows, but the screen flashes white for a moment.
; 1 = no restart, only the PV clock moves (no white flash). The music does NOT follow then.
; FORWARD: works well, the game runs the skipped script commands in one frame.
ForwardWithoutRestart=0

; BACKWARD: experimental. The script cannot run backwards, so the picture (motions, camera,
; 2D) can be out of sync after a jump back. Use at your own risk.
BackwardWithoutRestart=0

; 1 = show the small seek window at start (F8 shows/hides it later)
ShowWindow=1
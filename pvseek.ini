; PV Seek settings. Everything here is optional.
; Addresses are written the way Ghidra / IDA show them for DivaMegaMix.exe
; (image base 0x140000000), e.g. 0x14010EF00. The mod corrects for ASLR itself.
[PvSeek]

; ---- addresses (checked against this installed Mega Mix+ executable) ----

; A function that the game calls once per frame while a PV runs. It must take ONLY the
; pv_game pointer and return a bool/int (no float or other arguments), because the hook
; is declared as  bool f(pv_game*).  See README "Finding the addresses".
TickAddress=0x14024B0E0

; pv_game::restart. Leave empty to let the mod search for it (it needs AnchorA/B for that).
RestartAddress=0x1402436F0

; pv_game_music::play. Needed so the music follows the seek. Without it the picture
; seeks fine, but the music restarts from 0:00.
MusicPlayAddress=0x14023E2C0

; pv_game_music::load. This is how the music follows the seek. Leave empty: the mod looks for
; it inside restart (the function with "return -6"). If the log says it was not found, set it.
MusicLoadAddress=0x14023E440

; int32 pv_game_data.type. The running game reported 3 in PV Viewer.
; If the address cannot be read or does not equal ViewerMode, seeking is disabled.
ModeAddress=0x140DAE930

; Only used by the restart search: the one function that calls both is pv_game::restart.
AnchorAAddress=0x140104FB0
AnchorBAddress=0x1400FCEB0

; ---- behaviour ----

; Allow exactly this mode value. The game reported 3 when PV Viewer was tested.
; Practice, normal play, other values and unreadable mode memory are blocked.
ViewerMode=3

; Step sizes for the [ and ] keys (Shift = big step), in seconds.
StepSmallSeconds=5
StepBigSeconds=30

; Seeking with restart is the safe way: the game rebuilds the PV (motions, camera, 2D) and
; the music follows, but the screen flashes white for a moment.
; 1 = no restart, only the PV clock moves (no white flash). The music does NOT follow then.
; FORWARD: works well, the game runs the skipped script commands in one frame.
ForwardWithoutRestart=0

; BACKWARD: experimental. The script cannot run backwards, so the picture (motions, camera,
; 2D) can be out of sync after a jump back. Use at your own risk.
BackwardWithoutRestart=0

; 1 = show the small seek window at start (F8 shows/hides it later)
ShowWindow=1
